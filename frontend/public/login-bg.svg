<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Abstract ledger and document motif on deep navy">
  <defs>
    <linearGradient id="washFix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1130"/>
      <stop offset="0.6" stop-color="#0E1A43"/>
      <stop offset="1" stop-color="#152A63"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B62FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3B62FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="rules" x="0" y="0" width="1200" height="38" patternUnits="userSpaceOnUse">
      <line x1="0" y1="37.5" x2="1200" y2="37.5" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <linearGradient id="ruleFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#000" stop-opacity="1"/>
      <stop offset="0.82" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="ruleMask">
      <rect x="0" y="0" width="1200" height="1200" fill="url(#ruleFade)"/>
    </mask>
  </defs>

  <rect width="1200" height="1200" fill="url(#washFix)"/>

